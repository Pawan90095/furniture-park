<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <!-- <link rel="icon" type="image/svg+xml" href="/vite.svg" /> -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Furniture Park | Modern Luxury Furniture</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Tenor+Sans&family=Work+Sans:wght@300;400;500;600&display=swap"
        rel="stylesheet">
</head>

<body>
    <div id="root"></div>
    <script>
        window.onerror = function (message, source, lineno, colno, error) {
            const root = document.getElementById('root');
            root.innerHTML = '<div style="color:red; padding:20px; font-family:sans-serif;">' +
                '<h1>Something went wrong</h1>' +
                '<p>' + message + '</p>' +
                '<pre>' + (error ? error.stack : '') + '</pre>' +
                '</div>';
        };
    </script>
    <script type="module" src="./src/main.jsx"></script>
</body>

</html>
